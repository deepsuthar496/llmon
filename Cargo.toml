[package]
name = "llmon"
version = "0.1.2"
edition = "2021"
description = "llmon — fast, lightweight, single-binary LLM runner (Rust). Ollama-compatible, OpenAI-compatible."
license = "MIT"

[[bin]]
name = "llmon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dirs = "5"
sha2 = "0.10"
hex = "0.4"
indicatif = "0.17"
rustyline = "14"
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
